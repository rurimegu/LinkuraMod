name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version mod_manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: true
          include-templates: true

      - name: Import Godot assets
        # Run headless import so the .godot/ cache is populated before export
        run: godot --headless --import || true

      - name: Restore .NET packages
        run: dotnet restore LinkuraMod.csproj

      - name: Build .NET (ExportRelease)
        run: dotnet build LinkuraMod.sln --configuration ExportRelease --no-restore

      - name: Get RitsuLib version
        id: ritsulib
        run: |
          # Extract the minimum version from the Version range in the csproj.
          # Handles formats: "[0.2.30,)", "0.2.30", "[0.2.30,0.3.0)", etc.
          RAW=$(grep -oP '(?<=Include="STS2\.RitsuLib" Version=")[^"]+' LinkuraMod.csproj)
          if [ -z "$RAW" ]; then
            echo "ERROR: STS2.RitsuLib PackageReference not found in csproj" >&2
            exit 1
          fi
          # Strip leading bracket/parenthesis and take the first version token
          MIN_VERSION=$(echo "$RAW" | sed 's/^[[(]//' | cut -d',' -f1 | sed 's/[])]$//')
          echo "version=$MIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Export PCK
        run: godot --headless --export-pack "Windows Desktop" LinkuraMod.pck

      - name: Package release zip
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          mkdir dist

          # Godot.NET.Sdk outputs the DLL to .godot/mono/temp/bin/<config>/
          # Fall back to the standard dotnet output directory if not found there.
          DLL=$(find . \( -path "./.git" -o -path "./dist" \) -prune -o \
                  -name "LinkuraMod.dll" -path "*ExportRelease*" -print | head -1)
          if [ -z "$DLL" ]; then
            echo "ERROR: LinkuraMod.dll not found" >&2
            exit 1
          fi
          echo "Using DLL: $DLL"

          cp "$DLL" dist/LinkuraMod.dll
          cp mod_manifest.json dist/
          cp LinkuraMod.pck dist/

          zip -j "LinkuraMod-${VERSION}.zip" dist/*
          echo "ZIP=LinkuraMod-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LinkuraMod v${{ steps.version.outputs.version }}
          body: |
            > **Requires [RitsuLib ≥ v${{ steps.ritsulib.outputs.version }}](https://github.com/BAKAOLC/STS2-RitsuLib/releases/)**
          files: ${{ env.ZIP }}
          generate_release_notes: true

      - name: Generate update manifest
        run: node tools/generate-update-manifest.mjs

      - name: Upload update manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 cp public/update.json "s3://${R2_BUCKET_NAME}/linkuramod/update.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json
